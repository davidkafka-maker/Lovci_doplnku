function clearTimer(){clearInterval(state.timer);state.timer=null}
function clearPending(){clearTimeout(state.pending);state.pending=null}
function render(h,mode=state.mode){document.body.className=mode?'mode-'+mode:'';app.innerHTML=h+(state.screen!=='question'&&!h.includes('VÝSLEDKOVÁ TABULKA')?`<div class="row"><a class="btn ghost" href="${RESULTS_SHEET_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div>`:'');document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){if(activeProtected()){cheatFinish('odchod do hlavního menu');return}clearTimer();clearPending();state.screen='home';state.mode=null;render(`<div class="card"><h1 class="title">Lovci doplňků</h1><p class="subtitle">Najdi doplněk, nebo zvol NENÍ.<br><strong>Verze: 110 vět • 30 sekund na odpověď</strong></p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button></div><div class="row"><a class="btn ghost" href="${RESULTS_SHEET_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">Každé kolo: 10 vět s doplňkem a 10 bez doplňku v náhodném pořadí.<br>Označ doplněk bez rozvíjejících výrazů; zahrň předložku, jako nebo zvratné se. Pak potvrď HOTOVO.<br>VÝZVA: všech 20 správně za sebou = jednička. Chyba či vypršení času spustí nové kolo.<br>TEST: 20 úloh, každá za 1 bod. Čas: ${TIME_LIMIT} s na úlohu.</p><table class="resultTable"><tr><th>Body v testu</th><th>Známka</th></tr><tr><td>20–18</td><td>1</td></tr><tr><td>17–16</td><td>2</td></tr><tr><td>15–14</td><td>3</td></tr><tr><td>13–12</td><td>4</td></tr><tr><td>11–0</td><td>5</td></tr></table><p class="small">Během hry zůstaň na této stránce. Opuštění aktivního okna ukončí pokus se známkou 6.<br>Databáze: 60 vět s doplňkem + 50 bez doplňku = 110 vět.</p></div>`,null)}
function nameScreen(mode){clearPending();state.mode=mode;state.screen='name';render(`<div class="card"><h1 class="title">${mode==='challenge'?'VÝZVA':'TEST'}</h1><div class="nameBox"><input class="input" id="name" autocomplete="name" placeholder="Příjmení žáka" aria-label="Příjmení žáka"><input class="input" id="clazz" placeholder="Třída" aria-label="Třída"><button class="btn ${mode==='challenge'?'challengeBtn':'testBtn'}" id="start">ZAČÍT</button><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>`);document.getElementById('start').onclick=()=>{const name=document.getElementById('name').value.trim(),clazz=document.getElementById('clazz').value.trim();if(!name||!clazz){alert('Vyplň příjmení i třídu.');return}state.name=name;state.clazz=clazz;unlockAudio();start(mode)}}
function start(mode){clearTimer();clearPending();state={...state,screen:'question',mode,pool:selectRound(),index:0,score:0,correct:0,wrong:0,streak:0,locked:false,cheated:false,finishSent:false,restart:false};next()}
function next(){clearTimer();clearPending();if(state.index>=20)return finish();state.screen='question';state.current=state.pool[state.index];state.locked=false;renderQuestion();startTimer()}
function renderQuestion(){
state.selected=new Set();state.none=false;
const q=state.current;
render(`<div class="card"><div class="topbar"><div class="seal ${state.mode==='challenge'?'challengeSeal':'testSeal'}">${state.mode==='challenge'?'VÝZVA':'TEST'}</div><div class="timeCenter"><span id="time">${TIME_LIMIT}</span><span class="status">ÚLOHA ${state.index+1}/20 • ${state.mode==='test'?'BODY '+state.score:'SÉRIE '+state.streak}/20</span></div><div class="seal sectionSeal">NAJDI<br>DOPLNĚK</div></div><div class="prompt">Označ doplněk bez rozvíjejících výrazů, nebo zvol NENÍ.</div><div class="question words">${q.text.split(/\s+/).map((word,i)=>`<button class="wordBtn" data-word="${i}" aria-pressed="false">${esc(word)}</button>`).join(' ')}</div><div class="row"><button class="btn ghost" id="none" aria-pressed="false">NENÍ</button><button class="btn" id="done" disabled>HOTOVO</button></div><div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nextRow"></div><div class="row"><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>`);
document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(state.locked)return;const i=Number(b.dataset.word);state.none=false;state.selected.has(i)?state.selected.delete(i):state.selected.add(i);updateSelection()});
document.getElementById('none').onclick=()=>{if(state.locked)return;state.none=!state.none;state.selected.clear();updateSelection()};document.getElementById('done').onclick=answer;
}
function updateSelection(){document.querySelectorAll('[data-word]').forEach(b=>{const yes=state.selected.has(Number(b.dataset.word));b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',yes)});const n=document.getElementById('none');n.classList.toggle('selected',state.none);n.setAttribute('aria-pressed',state.none);document.getElementById('done').disabled=!state.none&&!state.selected.size}
function markAnswers(){const q=state.current;document.querySelectorAll('[data-word]').forEach(b=>{const i=Number(b.dataset.word);b.disabled=true;if(q.indices.includes(i))b.classList.add('correct');else if(state.selected.has(i))b.classList.add('wrong')});const n=document.getElementById('none');n.disabled=true;if(!q.indices.length)n.classList.add('correct');else if(state.none)n.classList.add('wrong');document.getElementById('done').disabled=true}
function answer(){if(state.locked||state.screen!=='question'||(!state.none&&!state.selected.size))return;const ids=state.current.indices;handleAnswer(ids.length? !state.none&&state.selected.size===ids.length&&ids.every(i=>state.selected.has(i)):state.none,null,false)}
function timeout(){if(!state.locked&&state.screen==='question')handleAnswer(false,null,true)}
function handleAnswer(good,button,expired){state.locked=true;clearTimer();markAnswers(button);const q=state.current;let fb;if(good){state.correct++;state.score++;state.streak++;fb='<span class="ok">SPRÁVNĚ! +1 BOD</span>';soundCorrect()}else{state.wrong++;state.streak=0;state.restart=state.mode==='challenge';fb=`<span class="bad">${expired?'ČAS VYPRŠEL':'CHYBA'}${state.restart?' — VÝZVA ZAČÍNÁ ZNOVU':''}</span><br><span class="small">Správně: ${esc(q.answer)}${q.explanation?' • '+esc(q.explanation):''}</span>`;soundWrong()}document.getElementById('fb').innerHTML=fb;state.index++;document.getElementById('nextRow').innerHTML=`<button class="btn ghost" data-act="next">${state.restart?'NOVÁ VÝZVA':state.index===20?'VÝSLEDEK':'DALŠÍ'}</button>`;document.querySelector('[data-act="next"]').onclick=advance;state.pending=setTimeout(advance,good?1200:6000)}
function advance(){if(!state.locked||state.screen!=='question')return;clearPending();if(state.restart){state.pool=selectRound();state.index=0;state.score=0;state.streak=0;state.restart=false}next()}
function startTimer(){state.deadline=Date.now()+TIME_LIMIT*1000;updateTime();state.timer=setInterval(()=>{updateTime();if(Date.now()>=state.deadline){clearTimer();timeout()}},100)}
function updateTime(){const e=document.getElementById('time');if(e)e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function grade(s){return s>=18?1:s>=16?2:s>=14?3:s>=12?4:5}
function finish(){clearTimer();clearPending();state.screen='finish';const z=state.mode==='challenge'?1:grade(state.score);render(`<div class="card"><h1 class="title">${state.mode==='challenge'?'VÝZVA SPLNĚNA':'VÝSLEDEK'}</h1><div class="result"><b>${esc(state.name)}</b> • ${esc(state.clazz)}<br><b>Body:</b> ${state.score}/20<br><b>Známka:</b> ${z}${state.mode==='challenge'?'<br>Všech 20 odpovědí za sebou správně!':''}</div><div class="sendStatus" id="sendStatus"></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`);sendResult(z,state.mode==='challenge'?'VÝZVA':'TEST')}
function buildPayload(z,kind){return {timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:state.mode,oddil:'doplňky',body:state.score,celkem:20,spravne:state.correct,spatne:state.wrong,poznamka:kind,sheetId:SHEET_ID,app:'Lovci doplňků'}}
function sendResult(z,kind,urgent=false){if(state.finishSent)return;state.finishSent=true;const params=new URLSearchParams();Object.entries(buildPayload(z,kind)).forEach(([k,v])=>params.append(k,String(v??'')));try{if(urgent&&navigator.sendBeacon){navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([params.toString()],{type:'application/x-www-form-urlencoded'}))}else fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true}).then(()=>{const e=document.getElementById('sendStatus');if(e)e.textContent='Požadavek na zápis byl odeslán. Výsledek ověř ve výsledkové tabulce.'}).catch(()=>{const e=document.getElementById('sendStatus');if(e)e.textContent='Výsledek se nepodařilo odeslat. Poznamenej si body a známku.'})}catch(e){}}
function activeProtected(){return ['test','challenge'].includes(state.mode)&&state.screen==='question'}
function cheatFinish(reason){if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen='finish';clearTimer();clearPending();soundCheat();sendResult(6,'PODVOD: '+reason,true);render(`<div class="card cheat"><h1 class="title">POKUS UKONČEN</h1><div class="result">Došlo k opuštění aktivního okna.<br><b>Známka: 6</b></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`)}
let audioCtx=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,gain=.08,type='sine',delay=0){try{unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function soundCorrect(){tone(720,.08,.06);tone(980,.10,.05,'sine',.07)}function soundWrong(){tone(150,.20,.22,'square');tone(110,.23,.20,'sawtooth',.17)}function soundCheat(){tone(95,.65,.28,'sawtooth');tone(70,.65,.24,'square',.35)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cheatFinish('přepnutí mimo stránku')});window.addEventListener('pagehide',()=>cheatFinish('opuštění stránky'));window.addEventListener('beforeunload',e=>{if(activeProtected()){e.preventDefault();e.returnValue=''}});window.addEventListener('blur',()=>setTimeout(()=>{if(activeProtected()&&document.visibilityState==='visible'&&!document.hasFocus())cheatFinish('ztráta aktivního okna')},650));
const actions={home,nameChallenge:()=>nameScreen('challenge'),nameTest:()=>nameScreen('test'),next:advance};home();
</script></body></html>
